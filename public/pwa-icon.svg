<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with subtle squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Note sheet -->
  <g filter="url(#dropShadow)">
    <rect x="116" y="96" width="280" height="320" rx="28" fill="url(#sheetGrad)"/>
    
    <!-- Header accent line -->
    <rect x="156" y="152" width="120" height="18" rx="9" fill="#2563eb"/>
    
    <!-- Content lines -->
    <rect x="156" y="202" width="200" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="156" y="238" width="180" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="156" y="274" width="150" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="156" y="310" width="120" height="12" rx="6" fill="#e2e8f0"/>
    
    <!-- Pinned indicator pin icon on top right of sheet -->
    <circle cx="348" cy="156" r="14" fill="#eff6ff"/>
    <path d="M348 146 v20 M342 152 h12" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Pen / Pencil in bottom right -->
  <g transform="translate(310, 270) rotate(-45)">
    <rect x="0" y="0" width="34" height="110" rx="10" fill="#f59e0b"/>
    <rect x="0" y="24" width="34" height="64" fill="#fbbf24"/>
    <path d="M0 110 L17 142 L34 110 Z" fill="#e2e8f0"/>
    <path d="M12 132 L17 142 L22 132 Z" fill="#1e293b"/>
    <rect x="0" y="-12" width="34" height="14" rx="4" fill="#ef4444"/>
  </g>
</svg>
